<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Holy Grail - Alvis Abreo</title>
    <link rel="canonical" href="https://alvisabreo.com/holygrail">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(0, 0, 0, 0.85) 100%),
                url('https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=1920&q=80');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .top-bar a,
        .top-bar button {
            color: white;
            opacity: 0.7;
            text-decoration: none;
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
        }

        .top-bar a:hover,
        .top-bar button:hover {
            opacity: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grail-icon {
            width: 1.3em;
            height: 1.3em;
            vertical-align: -0.3em;
            margin-right: 0.15em;
            overflow: visible;
            filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.6));
        }

        .grail-halo {
            animation: grailPulse 3s ease-in-out infinite;
            transform-origin: 32px 26px;
        }

        .grail-sweep {
            animation: grailSweep 3s ease-in-out infinite;
        }

        .grail-sparkle {
            transform-box: fill-box;
            transform-origin: center;
            animation: grailTwinkle 2s ease-in-out infinite;
        }

        .grail-sparkle.s2 { animation-delay: 0.7s; }
        .grail-sparkle.s3 { animation-delay: 1.3s; }

        @keyframes grailPulse {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @keyframes grailSweep {
            0% { transform: skewX(-20deg) translateX(0); }
            60%, 100% { transform: skewX(-20deg) translateX(110px); }
        }

        @keyframes grailTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.4); }
            50% { opacity: 1; transform: scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .grail-halo,
            .grail-sweep,
            .grail-sparkle {
                animation: none;
            }
        }

        .sub-message {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
            font-style: italic;
            text-align: center;
        }

        .add-box {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .add-box.visible {
            display: block;
        }

        .add-box textarea {
            width: 100%;
            min-height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 15px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            margin-bottom: 12px;
        }

        .add-box textarea:focus {
            border-color: rgba(255, 255, 255, 0.7);
        }

        .add-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .status {
            color: #fca5a5;
            margin-top: 10px;
            min-height: 1.2rem;
        }

        .facts-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .fact {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 25px;
            font-size: 1.1rem;
            line-height: 1.5;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .fact:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .fact-number {
            font-weight: bold;
            opacity: 0.5;
            flex-shrink: 0;
        }

        .fact-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .edit-btn,
        .delete-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .delete-btn {
            color: #fca5a5;
            font-size: 1.2rem;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            opacity: 1;
        }

        .edit-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .edit-area textarea {
            width: 100%;
            min-height: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 12px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 10px;
            resize: vertical;
            outline: none;
        }

        .edit-area .add-actions .btn {
            padding: 6px 18px;
            font-size: 0.95rem;
        }

        .empty {
            text-align: center;
            opacity: 0.7;
            font-style: italic;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .sub-message {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .fact {
                padding: 15px 18px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="/">← Home</a>
            <a href="/login" id="loginLink">🔐 Login</a>
            <button id="logoutBtn" style="display: none;">Logout 👋</button>
        </div>

        <h1>
            <svg class="grail-icon" viewBox="0 0 64 64" aria-hidden="true">
                <defs>
                    <radialGradient id="grailHalo" cx="50%" cy="40%" r="50%">
                        <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
                    </radialGradient>
                    <linearGradient id="grailGold" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#fef3c7"/>
                        <stop offset="45%" stop-color="#facc15"/>
                        <stop offset="100%" stop-color="#b45309"/>
                    </linearGradient>
                    <linearGradient id="grailShine" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
                        <stop offset="50%" stop-color="#fff" stop-opacity="0.85"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                    </linearGradient>
                    <clipPath id="grailClip">
                        <path d="M14 12 H50 C50 28 42 36 32 36 C22 36 14 28 14 12 Z"/>
                        <rect x="12" y="9" width="40" height="5" rx="2.5"/>
                        <path d="M29 36 H35 L34 46 H30 Z"/>
                        <path d="M20 54 C20 49 26 46 32 46 C38 46 44 49 44 54 Z"/>
                        <rect x="18" y="53" width="28" height="4" rx="2"/>
                    </clipPath>
                </defs>
                <circle class="grail-halo" cx="32" cy="26" r="30" fill="url(#grailHalo)"/>
                <g fill="url(#grailGold)" stroke="#92400e" stroke-width="0.8">
                    <path d="M14 12 H50 C50 28 42 36 32 36 C22 36 14 28 14 12 Z"/>
                    <rect x="12" y="9" width="40" height="5" rx="2.5"/>
                    <path d="M29 36 H35 L34 46 H30 Z"/>
                    <ellipse cx="32" cy="41" rx="4.5" ry="2"/>
                    <path d="M20 54 C20 49 26 46 32 46 C38 46 44 49 44 54 Z"/>
                    <rect x="18" y="53" width="28" height="4" rx="2"/>
                </g>
                <circle cx="32" cy="22" r="3.2" fill="#dc2626" stroke="#fde68a" stroke-width="1"/>
                <path d="M19 16 C19 24 22 29 26 32" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
                <g clip-path="url(#grailClip)">
                    <rect class="grail-sweep" x="-20" y="0" width="14" height="64" fill="url(#grailShine)" transform="skewX(-20)"/>
                </g>
                <path class="grail-sparkle s1" d="M10 4 L11.2 7.8 L15 9 L11.2 10.2 L10 14 L8.8 10.2 L5 9 L8.8 7.8 Z" fill="#fff"/>
                <path class="grail-sparkle s2" d="M54 18 L55 21 L58 22 L55 23 L54 26 L53 23 L50 22 L53 21 Z" fill="#fef3c7"/>
                <path class="grail-sparkle s3" d="M49 2 L49.7 4.3 L52 5 L49.7 5.7 L49 8 L48.3 5.7 L46 5 L48.3 4.3 Z" fill="#fff"/>
            </svg>
            The Holy Grail
        </h1>
        <p class="sub-message">Stuff school conveniently forgot to mention.</p>

        <div class="add-box" id="addBox">
            <textarea id="factInput" placeholder="Drop some knowledge..."></textarea>
            <div class="add-actions">
                <button class="btn" id="addFactBtn">Add Fact ➕</button>
            </div>
            <p class="status" id="status"></p>
        </div>

        <ul class="facts-list" id="factsList"></ul>

        <div class="footer">
            <p>© 2026 Alvis Abreo - Made with ☕ and biskut.</p>
        </div>
    </div>

    <script>
        // Google Apps Script web app backed by the facts Google Sheet (see apps-script/Code.gs).
        const API_URL = 'https://script.google.com/macros/s/AKfycbxnRntT5Q7fLjGZWfS5fpHPg2KxZBoOXHsLTyOMNMju2ehgz2LM-RHnb8abfVuAkaC_xQ/exec';

        function getKey() {
            try {
                return sessionStorage.getItem('factsKey');
            } catch (err) {
                return null;
            }
        }

        function showMessage(text) {
            const list = document.getElementById('factsList');
            list.innerHTML = '';
            const item = document.createElement('li');
            item.className = 'empty';
            item.textContent = text;
            list.appendChild(item);
        }

        // text/plain avoids a CORS preflight, which Apps Script doesn't support.
        async function callApi(payload) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ key: getKey() }, payload))
            });
            return response.json();
        }

        function renderFacts(facts) {
            const list = document.getElementById('factsList');
            const loggedIn = !!getKey();
            list.innerHTML = '';

            if (facts.length === 0) {
                showMessage('No facts yet. Suspicious.');
                return;
            }

            facts.forEach((fact, i) => {
                const item = document.createElement('li');
                item.className = 'fact';

                const number = document.createElement('span');
                number.className = 'fact-number';
                number.textContent = '#' + (i + 1);

                const text = document.createElement('span');
                text.className = 'fact-text';
                text.textContent = fact.text;

                item.appendChild(number);
                item.appendChild(text);

                if (loggedIn) {
                    const edit = document.createElement('button');
                    edit.className = 'edit-btn';
                    edit.title = 'Edit fact';
                    edit.textContent = '✏️';
                    edit.addEventListener('click', function() {
                        startEditing(item, fact);
                    });
                    item.appendChild(edit);

                    const del = document.createElement('button');
                    del.className = 'delete-btn';
                    del.title = 'Delete fact';
                    del.textContent = '✕';
                    del.addEventListener('click', async function() {
                        if (!confirm('Delete this fact?')) return;
                        del.disabled = true;
                        try {
                            const result = await callApi({ action: 'delete', row: fact.row, text: fact.text });
                            if (!result.ok) alert(result.error);
                        } catch (err) {
                            alert("Couldn't reach the server. Try again.");
                        }
                        loadFacts();
                    });
                    item.appendChild(del);
                }

                list.appendChild(item);
            });
        }

        // Swaps a fact's text for a text box with Save / Cancel.
        function startEditing(item, fact) {
            const number = item.querySelector('.fact-number');
            item.innerHTML = '';
            item.appendChild(number);

            const area = document.createElement('div');
            area.className = 'edit-area';

            const input = document.createElement('textarea');
            input.value = fact.text;

            const actions = document.createElement('div');
            actions.className = 'add-actions';

            const save = document.createElement('button');
            save.className = 'btn';
            save.textContent = 'Save 💾';

            const cancel = document.createElement('button');
            cancel.className = 'btn';
            cancel.textContent = 'Cancel';
            cancel.addEventListener('click', loadFacts);

            const status = document.createElement('p');
            status.className = 'status';

            save.addEventListener('click', async function() {
                const newText = input.value.trim();
                if (!newText) return;
                if (newText === fact.text) {
                    loadFacts();
                    return;
                }

                save.disabled = true;
                cancel.disabled = true;
                status.textContent = '';
                try {
                    const result = await callApi({ action: 'edit', row: fact.row, text: fact.text, newText: newText });
                    if (result.ok) {
                        loadFacts();
                        return;
                    }
                    status.textContent = result.error;
                } catch (err) {
                    status.textContent = "Couldn't reach the server. Try again.";
                }
                save.disabled = false;
                cancel.disabled = false;
            });

            actions.appendChild(save);
            actions.appendChild(cancel);
            area.appendChild(input);
            area.appendChild(actions);
            area.appendChild(status);
            item.appendChild(area);
            input.focus();
        }

        async function loadFacts() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                renderFacts(result.facts || []);
            } catch (err) {
                showMessage("Couldn't load facts. Try refreshing.");
            }
        }

        if (getKey()) {
            document.getElementById('addBox').classList.add('visible');
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline';
        }

        document.getElementById('addFactBtn').addEventListener('click', async function() {
            const input = document.getElementById('factInput');
            const status = document.getElementById('status');
            const text = input.value.trim();
            if (!text) return;

            this.disabled = true;
            status.textContent = '';
            try {
                const result = await callApi({ action: 'add', text: text });
                if (result.ok) {
                    input.value = '';
                    await loadFacts();
                } else {
                    status.textContent = result.error;
                }
            } catch (err) {
                status.textContent = "Couldn't reach the server. Try again.";
            }
            this.disabled = false;
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            try {
                sessionStorage.removeItem('factsKey');
            } catch (err) {}
            window.location.reload();
        });

        showMessage('Loading facts...');
        loadFacts();
    </script>
</body>
</html>
