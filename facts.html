<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facts No One Tells You - Alvis Abreo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(0, 0, 0, 0.85) 100%),
                url('https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=1920&q=80');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .top-bar a,
        .top-bar button {
            color: white;
            opacity: 0.7;
            text-decoration: none;
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
        }

        .top-bar a:hover,
        .top-bar button:hover {
            opacity: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .sub-message {
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
            font-style: italic;
            text-align: center;
        }

        .add-box {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .add-box.visible {
            display: block;
        }

        .add-box textarea {
            width: 100%;
            min-height: 80px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 15px;
            font-size: 1rem;
            font-family: inherit;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            margin-bottom: 12px;
        }

        .add-box textarea:focus {
            border-color: rgba(255, 255, 255, 0.7);
        }

        .add-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .status {
            color: #fca5a5;
            margin-top: 10px;
            min-height: 1.2rem;
        }

        .facts-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .fact {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px 25px;
            font-size: 1.1rem;
            line-height: 1.5;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .fact:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .fact-number {
            font-weight: bold;
            opacity: 0.5;
            flex-shrink: 0;
        }

        .fact-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #fca5a5;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .empty {
            text-align: center;
            opacity: 0.7;
            font-style: italic;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .sub-message {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .fact {
                padding: 15px 18px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html">← Home</a>
            <a href="login.html" id="loginLink">🔐 Login</a>
            <button id="logoutBtn" style="display: none;">Logout 👋</button>
        </div>

        <h1>🧠 Facts No One Tells You</h1>
        <p class="sub-message">Stuff school conveniently forgot to mention.</p>

        <div class="add-box" id="addBox">
            <textarea id="factInput" placeholder="Drop some knowledge..."></textarea>
            <div class="add-actions">
                <button class="btn" id="addFactBtn">Add Fact ➕</button>
            </div>
            <p class="status" id="status"></p>
        </div>

        <ul class="facts-list" id="factsList"></ul>

        <div class="footer">
            <p>© 2026 Alvis Abreo - Made with ☕ and biskut.</p>
        </div>
    </div>

    <script>
        // Google Apps Script web app backed by the facts Google Sheet (see apps-script/Code.gs).
        const API_URL = 'https://script.google.com/macros/s/AKfycbxnRntT5Q7fLjGZWfS5fpHPg2KxZBoOXHsLTyOMNMju2ehgz2LM-RHnb8abfVuAkaC_xQ/exec';

        function getKey() {
            try {
                return sessionStorage.getItem('factsKey');
            } catch (err) {
                return null;
            }
        }

        function showMessage(text) {
            const list = document.getElementById('factsList');
            list.innerHTML = '';
            const item = document.createElement('li');
            item.className = 'empty';
            item.textContent = text;
            list.appendChild(item);
        }

        // text/plain avoids a CORS preflight, which Apps Script doesn't support.
        async function callApi(payload) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ key: getKey() }, payload))
            });
            return response.json();
        }

        function renderFacts(facts) {
            const list = document.getElementById('factsList');
            const loggedIn = !!getKey();
            list.innerHTML = '';

            if (facts.length === 0) {
                showMessage('No facts yet. Suspicious.');
                return;
            }

            facts.forEach((fact, i) => {
                const item = document.createElement('li');
                item.className = 'fact';

                const number = document.createElement('span');
                number.className = 'fact-number';
                number.textContent = '#' + (i + 1);

                const text = document.createElement('span');
                text.className = 'fact-text';
                text.textContent = fact.text;

                item.appendChild(number);
                item.appendChild(text);

                if (loggedIn) {
                    const del = document.createElement('button');
                    del.className = 'delete-btn';
                    del.title = 'Delete fact';
                    del.textContent = '✕';
                    del.addEventListener('click', async function() {
                        if (!confirm('Delete this fact?')) return;
                        del.disabled = true;
                        try {
                            const result = await callApi({ action: 'delete', row: fact.row, text: fact.text });
                            if (!result.ok) alert(result.error);
                        } catch (err) {
                            alert("Couldn't reach the server. Try again.");
                        }
                        loadFacts();
                    });
                    item.appendChild(del);
                }

                list.appendChild(item);
            });
        }

        async function loadFacts() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                renderFacts(result.facts || []);
            } catch (err) {
                showMessage("Couldn't load facts. Try refreshing.");
            }
        }

        if (getKey()) {
            document.getElementById('addBox').classList.add('visible');
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline';
        }

        document.getElementById('addFactBtn').addEventListener('click', async function() {
            const input = document.getElementById('factInput');
            const status = document.getElementById('status');
            const text = input.value.trim();
            if (!text) return;

            this.disabled = true;
            status.textContent = '';
            try {
                const result = await callApi({ action: 'add', text: text });
                if (result.ok) {
                    input.value = '';
                    await loadFacts();
                } else {
                    status.textContent = result.error;
                }
            } catch (err) {
                status.textContent = "Couldn't reach the server. Try again.";
            }
            this.disabled = false;
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            try {
                sessionStorage.removeItem('factsKey');
            } catch (err) {}
            window.location.reload();
        });

        showMessage('Loading facts...');
        loadFacts();
    </script>
</body>
</html>
